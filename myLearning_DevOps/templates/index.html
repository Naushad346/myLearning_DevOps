<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submit data</title>
  </head>
  <body>
    <main>
      <h1>Submit data</h1>
      {% with messages = get_flashed_messages(category_filter=["error"]) %}
        {% if messages %}
          <div role="alert">
            {% for message in messages %}
              <p>{{ message }}</p>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('submit_form') }}" method="post">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" value="{{ form.get('name', '') if form else '' }}" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ form.get('email', '') if form else '' }}" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" required>{{ form.get('message', '') if form else '' }}</textarea>

        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
